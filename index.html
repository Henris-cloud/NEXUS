<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#10151d">
<link rel="manifest" href="manifest.webmanifest">

<title>NEXUS — Communauté</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #fff;
}

header {
  padding: 20px;
  background: #10151d;
  border-bottom: 1px solid #26303c;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.bell {
  border: 0;
  background: transparent;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #10151d;
  border: 1px solid #26303c;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 16px;
}

#nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 18px;
}

#nav button,
.actions button,
#newPost,
#join {
  border: 1px solid #303b49;
  background: #151c25;
  color: white;
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
}

#nav button.active {
  background: #26364a;
}

#search {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #303b49;
  background: #0b0f14;
  color: white;
  margin-bottom: 18px;
}

.post-head {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #26364a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.who small {
  color: #9ba8b7;
}

.tag {
  display: inline-block;
  margin: 8px 0;
  color: #8ebcff;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.actions button.liked {
  background: #26364a;
}

.empty {
  text-align: center;
  color: #9ba8b7;
  padding: 30px;
}

.hidden {
  display: none;
}

.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.hero h1 {
  margin-top: 0;
}

.hero p {
  color: #aeb9c6;
}

@media (max-width: 600px) {
  .hero {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">NEXUS</div>
  <button class="bell">🔔</button>
</header>

<main>

  <section class="card hero">
    <div>
      <h1>NEXUS — Communauté</h1>
      <p>Partage, discute, découvre et relève des défis.</p>
    </div>

    <button id="join">Rejoindre le défi</button>
  </section>

  <div id="nav">
    <button class="active" data-view="Accueil">Accueil</button>
    <button data-view="Discussions générales">Discussions</button>
    <button data-view="Jeux vidéo">Jeux vidéo</button>
    <button data-view="Défis">Défis</button>
  </div>

  <input
    id="search"
    type="search"
    placeholder="Rechercher une publication..."
  >

  <div style="margin-bottom:18px;">
    <button id="newPost">➕ Nouvelle publication</button>
  </div>

  <h2 id="title">Publications de la communauté</h2>

  <section id="feed">

    <article class="card post" data-cat="Jeux vidéo">

      <div class="post-head">
        <div class="avatar">N</div>

        <div class="who">
          <b>NexusUser</b><br>
          <small>à l'instant · Jeux vidéo</small>
        </div>
      </div>

      <p>
        Bienvenue sur NEXUS ! 🎮
      </p>

      <span class="tag">#Jeux vidéo</span>

      <div class="actions">
        <button class="like">
          ❤️ J’aime <span>0</span>
        </button>

        <button class="comment">
          💬 Commenter
        </button>

        <button class="share">
          ↗ Partager
        </button>
      </div>

    </article>


    <article class="card post" data-cat="Défis">

      <div class="post-head">
        <div class="avatar">N</div>

        <div class="who">
          <b>NexusUser</b><br>
          <small>à l'instant · Défis</small>
        </div>
      </div>

      <p>
        Quel défi allez-vous relever aujourd’hui ? ⭐
      </p>

      <span class="tag">#Défis</span>

      <div class="actions">
        <button class="like">
          ❤️ J’aime <span>0</span>
        </button>

        <button class="comment">
          💬 Commenter
        </button>

        <button class="share">
          ↗ Partager
        </button>
      </div>

    </article>

  </section>

  <div id="empty" class="empty hidden">
    Aucune publication trouvée.
  </div>

</main>

<script>
(function () {

  "use strict";

  function setupPost(post) {

    var like = post.querySelector(".like");
    var comment = post.querySelector(".comment");
    var share = post.querySelector(".share");

    if (like) {
      like.addEventListener("click", function () {

        var count = like.querySelector("span");

        var value =
          parseInt(count.textContent, 10) || 0;

        if (like.classList.contains("liked")) {

          value = Math.max(0, value - 1);

          like.classList.remove("liked");

        } else {

          value = value + 1;

          like.classList.add("liked");
        }

        count.textContent = String(value);
      });
    }


    if (comment) {

      comment.addEventListener("click", function () {

        var text =
          window.prompt("Écris ton commentaire :");

        if (text && text.trim()) {

          window.alert("Commentaire ajouté !");
        }
      });
    }


    if (share) {

      share.addEventListener("click", function () {

        var url = window.location.href;

        if (
          navigator.clipboard &&
          window.isSecureContext
        ) {

          navigator.clipboard
            .writeText(url)
            .then(function () {

              window.alert("Lien copié !");

            })
            .catch(function () {

              window.prompt(
                "Copie ce lien :",
                url
              );

            });

        } else {

          window.prompt(
            "Copie ce lien :",
            url
          );
        }
      });
    }
  }


  document
    .querySelectorAll(".post")
    .forEach(function (post) {

      setupPost(post);

    });


  document
    .querySelectorAll("#nav button")
    .forEach(function (button) {

      button.addEventListener(
        "click",
        function () {

          document
            .querySelectorAll("#nav button")
            .forEach(function (item) {

              item.classList.remove("active");

            });

          button.classList.add("active");

          var category =
            button.getAttribute("data-view");

          if (category === "Accueil") {

            document.getElementById("title")
              .textContent =
              "Publications de la communauté";

          } else {

            document.getElementById("title")
              .textContent =
              category;
          }

          var visible = 0;

          document
            .querySelectorAll(".post")
            .forEach(function (post) {

              var show =
                category === "Accueil" ||
                post.getAttribute("data-cat") === category;

              post.style.display =
                show ? "" : "none";

              if (show) {
                visible++;
              }
            });

          document
            .getElementById("empty")
            .classList.toggle(
              "hidden",
              visible !== 0
            );
        }
      );
    });


  document
    .getElementById("search")
    .addEventListener(
      "input",
      function (event) {

        var query =
          event.target.value
            .toLowerCase()
            .trim();

        var visible = 0;

        document
          .querySelectorAll(".post")
          .forEach(function (post) {

            var show =
              post.textContent
                .toLowerCase()
                .indexOf(query) !== -1;

            post.style.display =
              show ? "" : "none";

            if (show) {
              visible++;
            }
          });

        document
          .getElementById("empty")
          .classList.toggle(
            "hidden",
            visible !== 0
          );
      }
    );


  document
    .getElementById("newPost")
    .addEventListener(
      "click",
      function () {

        var text =
          window.prompt(
            "Que veux-tu publier ?"
          );

        if (!text || !text.trim()) {
          return;
        }

        var post =
          document.createElement("article");

        post.className = "card post";

        post.setAttribute(
          "data-cat",
          "Discussions générales"
        );

        post.innerHTML =
          '<div class="post-head">' +
            '<div class="avatar">N</div>' +
            '<div class="who">' +
              '<b>NexusUser</b><br>' +
              '<small>à l’instant · Discussions générales</small>' +
            '</div>' +
          '</div>' +
          '<p></p>' +
          '<span class="tag">#Discussions générales</span>' +
          '<div class="actions">' +
            '<button class="like">❤️ J’aime <span>0</span></button>' +
            '<button class="comment">💬 Commenter</button>' +
            '<button class="share">↗ Partager</button>' +
          '</div>';

        post
          .querySelector("p")
          .textContent = text.trim();

        document
          .getElementById("feed")
          .prepend(post);

        setupPost(post);
      }
    );


  document
    .getElementById("join")
    .addEventListener(
      "click",
      function () {

        window.alert(
          "Défi rejoint ! +100 points ⭐"
        );
      }
    );


  document
    .querySelector(".bell")
    .addEventListener(
      "click",
      function () {

        window.alert(
          "Aucune nouvelle notification 🔔"
        );
      }
    );


  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      function () {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(function () {});

      }
    );
  }

})();
</script>

</body>
</html>
